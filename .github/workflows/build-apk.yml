{
  "name": "Build APK",
  "on": { "workflow_dispatch": {} },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "steps": [
        { "uses": "actions/checkout@v4" },
        { "uses": "actions/setup-node@v4", "with": { "node-version": 20 } },
        { "uses": "actions/setup-java@v4", "with": { "distribution": "temurin", "java-version": 17 } },
        { "name": "Install packages", "run": "npm install" },
        { "name": "Create Android project", "run": "npx cap add android" },
        { "name": "Patch permissions", "run": "node scripts/patch-android.js" },
        { "name": "Sync web files", "run": "npx cap sync android" },
        { "name": "Build APK", "run": "cd android && chmod +x gradlew && ./gradlew assembleDebug" },
        { "uses": "actions/upload-artifact@v4", "with": { "name": "english-study-apk", "path": "android/app/build/outputs/apk/debug/app-debug.apk" } }
      ]
    }
  }
}
